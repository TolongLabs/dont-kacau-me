<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img">
  <title>DKM receipt flow: from a finished turn to another session's context</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    .p { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .s { fill: #57606a; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .life { stroke: #afb8c1; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .ln { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#b); }
    .num { fill: #57606a; }
  </style>

  <rect x="0" y="0" width="1100" height="700" fill="#f6f8fa"/>

  <!-- lane headers -->
  <rect class="box" x="60" y="24" width="150" height="58" rx="8"/>
  <text class="p" x="135" y="48" font-size="14" font-weight="600" text-anchor="middle">Session A</text>
  <text class="p s" x="135" y="68" font-size="11.5" text-anchor="middle">worktree A, bound to #81</text>

  <rect class="box" x="256" y="24" width="150" height="58" rx="8"/>
  <text class="p" x="331" y="48" font-size="14" font-weight="600" text-anchor="middle">Stop hook</text>
  <text class="p s" x="331" y="68" font-size="11.5" text-anchor="middle">fires when the turn ends</text>

  <rect class="box" x="452" y="24" width="160" height="58" rx="8"/>
  <text class="p" x="532" y="48" font-size="14" font-weight="600" text-anchor="middle">GitHub issue #81</text>
  <text class="p s" x="532" y="68" font-size="11.5" text-anchor="middle">one comment, edited in place</text>

  <rect class="box" x="658" y="24" width="160" height="58" rx="8"/>
  <text class="p" x="738" y="48" font-size="14" font-weight="600" text-anchor="middle">Session B</text>
  <text class="p s" x="738" y="68" font-size="11.5" text-anchor="middle">worktree B, follows #81</text>

  <!-- lifelines -->
  <line class="life" x1="135" y1="82" x2="135" y2="640"/>
  <line class="life" x1="331" y1="82" x2="331" y2="640"/>
  <line class="life" x1="532" y1="82" x2="532" y2="640"/>
  <line class="life" x1="738" y1="82" x2="738" y2="640"/>

  <!-- 1 -->
  <circle cx="28" cy="132" r="12" fill="#e6eaef"/>
  <text class="p num" x="28" y="137" font-size="12" text-anchor="middle">1</text>
  <text class="p s" x="233" y="124" font-size="12" text-anchor="middle">the agent finishes a response</text>
  <path class="ln" d="M135 138 L327 138"/>

  <!-- 2 -->
  <circle cx="28" cy="196" r="12" fill="#e6eaef"/>
  <text class="p num" x="28" y="201" font-size="12" text-anchor="middle">2</text>
  <path class="ln" d="M331 172 L391 172 L391 202 L335 202"/>
  <text class="p s" x="399" y="190" font-size="12">read head, base, changed paths, checks</text>

  <!-- 3 decision -->
  <circle cx="28" cy="268" r="12" fill="#e6eaef"/>
  <text class="p num" x="28" y="273" font-size="12" text-anchor="middle">3</text>
  <path d="M331 236 L419 268 L331 300 L243 268 z" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="p" x="331" y="264" font-size="11" text-anchor="middle">head, blockers or</text>
  <text class="p" x="331" y="278" font-size="11" text-anchor="middle">checks changed?</text>
  <path class="ln" d="M243 268 L150 268"/>
  <rect x="146" y="246" width="102" height="17" fill="#f6f8fa"/>
  <text class="p s" x="197" y="259" font-size="11.5" text-anchor="middle">no — write nothing</text>
  <line x1="140" y1="256" x2="140" y2="280" stroke="#57606a" stroke-width="3"/>

  <!-- 4 -->
  <circle cx="28" cy="348" r="12" fill="#e6eaef"/>
  <text class="p num" x="28" y="353" font-size="12" text-anchor="middle">4</text>
  <text class="p s" x="432" y="340" font-size="12" text-anchor="middle">yes — upsert the receipt</text>
  <path class="ln" d="M331 354 L528 354"/>

  <!-- receipt callout -->
  <rect class="box" x="852" y="300" width="224" height="196" rx="8"/>
  <text class="p" x="964" y="325" font-size="13" font-weight="600" text-anchor="middle">The receipt</text>
  <text class="m" x="868" y="350" font-size="11.5">head</text>
  <rect x="1000" y="340" width="62" height="15" rx="7" fill="#cfe6d4"/>
  <text class="p" x="1031" y="351" font-size="10" text-anchor="middle">measured</text>
  <text class="m" x="868" y="374" font-size="11.5">changed_paths</text>
  <rect x="1000" y="364" width="62" height="15" rx="7" fill="#cfe6d4"/>
  <text class="p" x="1031" y="375" font-size="10" text-anchor="middle">measured</text>
  <text class="m" x="868" y="398" font-size="11.5">contract_delta</text>
  <rect x="1000" y="388" width="62" height="15" rx="7" fill="#cfe6d4"/>
  <text class="p" x="1031" y="399" font-size="10" text-anchor="middle">measured</text>
  <text class="m" x="868" y="422" font-size="11.5">checks</text>
  <rect x="1000" y="412" width="62" height="15" rx="7" fill="#cfe6d4"/>
  <text class="p" x="1031" y="423" font-size="10" text-anchor="middle">measured</text>
  <text class="m" x="868" y="446" font-size="11.5">blockers</text>
  <rect x="1000" y="436" width="62" height="15" rx="7" fill="#fbe0c4"/>
  <text class="p" x="1031" y="447" font-size="10" text-anchor="middle">reported</text>
  <text class="m" x="868" y="470" font-size="11.5">narrative</text>
  <rect x="998" y="460" width="66" height="15" rx="7" fill="#f5cfcf"/>
  <text class="p" x="1031" y="471" font-size="10" text-anchor="middle">unverified</text>
  <text class="p s" x="964" y="516" font-size="10.5" text-anchor="middle">measured may be acted on · reported may be</text>
  <text class="p s" x="964" y="530" font-size="10.5" text-anchor="middle">routed · unverified may only be displayed</text>
  <path class="ln" d="M612 360 L848 380"/>

  <!-- 5 -->
  <circle cx="28" cy="566" r="12" fill="#e6eaef"/>
  <text class="p num" x="28" y="571" font-size="12" text-anchor="middle">5</text>
  <rect x="492" y="544" width="290" height="18" fill="#f6f8fa"/>
  <text class="p s" x="637" y="558" font-size="12" text-anchor="middle">cursored pull on SessionStart or UserPromptSubmit</text>
  <path class="ln" d="M532 572 L734 572"/>

  <!-- 6 -->
  <circle cx="28" cy="622" r="12" fill="#e6eaef"/>
  <text class="p num" x="28" y="627" font-size="12" text-anchor="middle">6</text>
  <path class="ln" d="M738 600 L798 600 L798 628 L742 628"/>
  <text class="p s" x="806" y="619" font-size="12">reads the delta before writing</text>
  <text class="p s" x="806" y="634" font-size="12">against the old shape</text>
</svg>
